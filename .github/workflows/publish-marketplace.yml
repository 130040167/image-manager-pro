name: Publish to VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag containing the VSIX
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --pattern "image-manager-pro-${RELEASE_TAG#v}.vsix" --dir output
      - name: Check package identity and version
        run: |
          unzip -p "output/image-manager-pro-${RELEASE_TAG#v}.vsix" extension/package.json > manifest.json
          node -e 'const assert = require("node:assert/strict"); const p = require("./manifest.json"); assert.equal(p.publisher, "lucymystery"); assert.equal(p.name, "image-manager-pro"); assert.equal(`v${p.version}`, process.env.RELEASE_TAG); console.log(`${p.publisher}.${p.name} ${p.version}`);'
      - name: Publish with Trusted Publishing
        run: npx --yes --package @vscode/vsce@4.1.0 vsce publish --packagePath "output/image-manager-pro-${RELEASE_TAG#v}.vsix" --oidc
